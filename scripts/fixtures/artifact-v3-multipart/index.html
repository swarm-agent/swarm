<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Artifact V3 multipart fixture</title>
  <link rel="stylesheet" href="styles/theme.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main>
    <section id="hero" data-artifact-part="hero">
      <p class="eyebrow">Dependency-rich fixture</p>
      <h1>One project, complete revisions.</h1>
      <p class="lead">The Hero and Pricing cards share the same accent token and interaction code.</p>
      <button type="button" data-plan="team">Choose Team</button>
    </section>
    <section id="pricing" data-artifact-part="pricing" aria-labelledby="pricing-title">
      <h2 id="pricing-title">Plans</h2>
      <div id="plans" class="plans"></div>
    </section>
  </main>
  <footer id="footer" data-artifact-part="footer">Revision marker: <strong id="revision">ROOT</strong></footer>
</body>
</html>
