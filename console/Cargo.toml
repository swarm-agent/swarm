[package]
name = "swarm-console"
version = "0.1.0"
edition = "2024"

[dependencies]
# Small copies of media images for the Media cards (the version gpui uses).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
gpui = "=0.2.2"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
unicode-segmentation = "1.12"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

# gpui 0.2.2 pulls xattr 0.2.3, which uses libc::ENOATTR; libc 0.2.191 removed
# it on Linux. The vendored copy maps it to ENODATA (the same value there).
[patch.crates-io]
xattr = { path = "patches/xattr-0.2.3" }
# Color emoji before DejaVu Sans in the Linux font fallback (see the patched
# src/font/fallback/unix.rs).
cosmic-text = { path = "patches/cosmic-text-0.14.2" }
