// Exact logo-line routes: four canonical rounded-square contours, with the
// third contour searched from both directions so five currents remain distinct.
function roundedLogoLine(size, radius) {
  const h = size / 2, c = h - radius, q = 6;
  const pts = [{ x: 0, y: -h }, { x: 10, y: -h }, { x: c, y: -h }];
  const arc = (cx, cy, a0, a1) => {
    for (let i = 1; i <= q; i++) {
      const a = a0 + (a1 - a0) * (i / q);
      pts.push({ x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius });
    }
  };
  arc(c, -c, -Math.PI / 2, 0);
  pts.push({ x: h, y: 0 }, { x: h, y: c });
  arc(c, c, 0, Math.PI / 2);
  pts.push({ x: 0, y: h }, { x: -c, y: h });
  arc(-c, c, Math.PI / 2, Math.PI);
  pts.push({ x: -h, y: 0 }, { x: -h, y: -c });
  arc(-c, -c, Math.PI, Math.PI * 1.5);
  pts.push({ x: -10, y: -h }, { x: 0, y: -h });
  return pts;
}

function halfLogoLineToFault(size, radius, reverse) {
  const closed = roundedLogoLine(size, radius);
  const unique = closed.slice(0, -1);
  const bottom = unique.findIndex(p => p.x === 0 && p.y === size / 2);
  const targetX = reverse ? 10 : -10;
  const step = reverse ? -1 : 1;
  const out = [unique[bottom]];
  let i = bottom;
  while (out.length <= unique.length + 1) {
    i = (i + step + unique.length) % unique.length;
    out.push(unique[i]);
    if (unique[i].x === targetX && unique[i].y === -size / 2) break;
  }
  return out;
}

function initDiodeGrid(){
  const cell=10;
  const span=400;
  const list=[];
  for(let y=-span/2;y<=span/2;y+=cell){
    for(let x=-span/2;x<=span/2;x+=cell){
      const l=layerAt(x,y);
      if(l>=0){
        const yNorm=(y+span/2)/span;
        const xNorm=(x+span/2)/span;
        const diagDist=(x+span/2+y+span/2)/(2*span);
        list.push({x,y,layer:l,yNorm,xNorm,diagDist});
      }
    }
  }
  DIODES=list;
}

function initFinalDropGrid(){
  const cell=28;
  const list=[];
  for(let y=0;y<H;y+=cell){
    for(let x=0;x<W;x+=cell){
      const dx=x+cell/2-CX,dy=y+cell/2-CY;
      const l=layerAt(dx/1.85,dy/1.85);
      list.push({x:x+cell/2,y:y+cell/2,layer:l});
    }
  }
  FINAL_DROP_GRID=list;
}

function ensureInit(){
  if(isInitialized)return;
  if(!canvas){
    canvas=document.getElementById('stage');
    ctx=canvas.getContext('2d',{alpha:false});
  }
  initSprites();
  initDiodeGrid();
  initFinalDropGrid();
  isInitialized=true;
}

function pulseAt(ms){
  let best=0;
  for(const cue of CUES){
    const age=ms-cue;
    if(age>=0&&age<360)best=Math.max(best,Math.exp(-age/115));
  }
  return best;
}

function drawBackground(ms,energy){
  const g=ctx.createRadialGradient(CX,CY,10,CX,CY,1200);
  g.addColorStop(0,`rgba(6,20,36,${.48+energy*.20})`);
  g.addColorStop(.38,'#030711');
  g.addColorStop(1,'#010204');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.strokeStyle=`rgba(135,206,235,${.022+energy*.030})`;
  ctx.lineWidth=1;
  const drift=(ms/1000*36)%40;
  for(let x=-40+drift;x<W+40;x+=40){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }
  for(let y=-40+drift*.5;y<H+40;y+=40){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
  ctx.restore();

  const v=ctx.createRadialGradient(CX,CY,420,CX,CY,1180);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(1,'rgba(0,0,0,.92)');
  ctx.fillStyle=v;
  ctx.fillRect(0,0,W,H);
}

function drawTracked(text,x,y,spacing,color,alpha,font='600 16px Inter,system-ui,sans-serif'){
  ctx.save();
  ctx.font=font;
  ctx.fillStyle=color;
  ctx.globalAlpha=alpha;
  ctx.textBaseline='middle';
  
  const cacheKey=font+'_'+spacing+'_'+text;
  let layout=TEXT_LAYOUT_CACHE.get(cacheKey);
  if(!layout){
    let totalW=0;
    const charWidths=[];
    for(let i=0;i<text.length;i++){
      const cw=ctx.measureText(text[i]).width;
      charWidths.push(cw);
      totalW+=cw+spacing;
    }
    totalW-=spacing;
    
    const charOffsets=[];
    let curX=-totalW/2;
    for(let i=0;i<text.length;i++){
      charOffsets.push({ch:text[i],x:curX});
      curX+=charWidths[i]+spacing;
    }
    layout={totalW,charOffsets};
    TEXT_LAYOUT_CACHE.set(cacheKey,layout);
  }
  
  for(let i=0;i<layout.charOffsets.length;i++){
    const item=layout.charOffsets[i];
    ctx.fillText(item.ch,x+item.x,y);
  }
  ctx.restore();
}

function drawCornerBrackets(x,y,w,h,size,color,alpha){
  ctx.save();
  ctx.strokeStyle=rgba(color,alpha);
  ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(x,y+size);
  ctx.lineTo(x,y);
  ctx.lineTo(x+size,y);

  ctx.moveTo(x+w-size,y);
  ctx.lineTo(x+w,y);
  ctx.lineTo(x+w,y+size);

  ctx.moveTo(x,y+h-size);
  ctx.lineTo(x,y+h);
  ctx.lineTo(x+size,y+h);

  ctx.moveTo(x+w-size,y+h);
  ctx.lineTo(x+w,y+h);
  ctx.lineTo(x+w,y+h-size);
  ctx.stroke();
  ctx.restore();
}

function drawAsciiMark(cx,cy,scale,alpha,pulse,dense=false){
  const cols=dense?45:37,rows=cols,span=400*scale,cell=span/cols,glyph=['·',':','+','█'];
  ctx.save();
  ctx.font=`700 ${Math.max(8,cell*.94)}px ui-monospace,SFMono-Regular,Menlo,monospace`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.shadowColor='#00f0ff';
  ctx.shadowBlur=5+pulse*6;
  
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=(c+.5)*cell-span/2,y=(r+.5)*cell-span/2,l=layerAt(x/scale,y/scale);
      if(l<0)continue;
      const shimmer=.82+.18*Math.sin(c*2.2+r*2.5+pulse*10);
      ctx.globalAlpha=alpha*BASE_BOXES[l].a*shimmer;
      ctx.fillStyle=l>1?'#e0f2fe':l===1?'#00f0ff':'#87ceeb';
      ctx.fillText(glyph[l],cx+x,cy+y);
    }
  }
  ctx.restore();
}

function drawLedMark(cx,cy,scale,alpha,pulse,cell=12){
  const span=400*scale;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=alpha;
  
  for(let y=-span/2;y<=span/2;y+=cell){
    for(let x=-span/2;x<=span/2;x+=cell){
      const l=layerAt(x/scale,y/scale);
      if(l<0)continue;
      const a=BASE_BOXES[l].a*(.8+.2*Math.sin(x*.05+y*.05+pulse*9+l));
      const sprite=l===3?SPRITES.layer3:l===2?SPRITES.layer2:l===1?SPRITES.layer1:SPRITES.layer0;
      const dSize=Math.max(15,cell*1.7)*(1+pulse*.12);
      ctx.globalAlpha=alpha*a;
      ctx.drawImage(sprite,cx+x-dSize/2,cy+y-dSize/2,dSize,dSize);
    }
  }
  ctx.restore();
}

function drawCrystallineLedMatrix(cx,cy,scale,alpha,pulse,cell=10,rasterT=1){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=alpha;
  for(let i=0;i<DIODES.length;i++){
    const d=DIODES[i];
    if(d.yNorm>rasterT)continue;
    const lockFlash=clamp(1-(rasterT-d.yNorm)*4);
    const baseSprite=d.layer===3?SPRITES.layer3:d.layer===2?SPRITES.layer2:d.layer===1?SPRITES.layer1:SPRITES.layer0;
    const sprite=lockFlash>.35?SPRITES.lockFlash:baseSprite;
    const spriteSize=mix(18,25,lockFlash)*(scale/0.65)*(1+pulse*0.08);
    ctx.drawImage(sprite,cx+d.x*scale-spriteSize/2,cy+d.y*scale-spriteSize/2,spriteSize,spriteSize);
  }
  ctx.restore();
}

function drawExactSvgMark(cx,cy,scale,alpha,pulse){

function drawIcon(type,cx,cy,color,alpha,pulse,scale=1){
  ctx.save();
  ctx.translate(cx,cy);
  if(scale!==1)ctx.scale(scale,scale);
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=color;
  ctx.fillStyle=color;
  ctx.lineWidth=2.5/scale;
  ctx.shadowColor=color;
  ctx.shadowBlur=8+pulse*10;
  ctx.lineCap='square';
  ctx.lineJoin='miter';
  const dot=(x,y,r=5)=>{ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()};
  
  if(type==='agents'){
    ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(-26,18);ctx.lineTo(26,18);ctx.closePath();ctx.stroke();
    dot(0,-27,7);dot(-29,21,7);dot(29,21,7);dot(0,4,5);
  }else if(type==='plan'){
    ctx.strokeRect(-34,-36,68,72);
    for(let i=0;i<3;i++){
      const y=-21+i*22;
      ctx.beginPath();ctx.moveTo(-23,y);ctx.lineTo(-16,y+6);ctx.lineTo(-7,y-7);ctx.stroke();
      ctx.fillRect(2,y-3,21,3);
    }
  }else if(type==='sessions'){
    for(let i=2;i>=0;i--){
      ctx.globalAlpha=alpha*(1-i*.18);
      ctx.strokeRect(-36+i*9,-29-i*8,62,50);
    }
    ctx.beginPath();ctx.moveTo(-18,35);ctx.lineTo(18,35);ctx.stroke();dot(0,35,4);
  }else if(type==='tools'){
    ctx.strokeRect(-36,-30,29,29);ctx.strokeRect(7,-30,29,29);ctx.strokeRect(-15,13,30,25);
    ctx.beginPath();ctx.moveTo(-7,-1);ctx.lineTo(-7,13);ctx.moveTo(7,-1);ctx.lineTo(7,13);ctx.stroke();
  }else if(type==='media'){
    ctx.strokeRect(-38,-32,76,64);
    ctx.beginPath();ctx.moveTo(-29,19);ctx.lineTo(-8,-8);ctx.lineTo(7,8);ctx.lineTo(20,-5);ctx.lineTo(31,19);ctx.stroke();
    dot(20,-18,6);ctx.strokeRect(-8,-8,16,16);
  }else if(type==='worktree'){
    ctx.beginPath();ctx.moveTo(-28,-30);ctx.lineTo(-28,27);ctx.lineTo(25,27);
    ctx.moveTo(-28,-4);ctx.lineTo(20,-4);ctx.moveTo(20,-4);ctx.lineTo(20,-22);ctx.stroke();
    dot(-28,-32,6);dot(20,-24,6);dot(27,27,6);
  }
  ctx.restore();
}

function drawConnector(x1,y1,x2,y2,alpha,pulse,phase,color='#00f0ff'){
  ctx.save();
  ctx.strokeStyle=rgba(color,alpha*.45);
  ctx.lineWidth=1.8;
  ctx.setLineDash([6,10]);
  ctx.lineDashOffset=-phase*60;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
  ctx.setLineDash([]);
  
  for(let i=0;i<4;i++){
    const q=(phase*.4+i/4)%1,x=mix(x1,x2,q),y=mix(y1,y2,q);
    ctx.fillStyle=rgba(color,alpha*(.6+pulse*.4));
    ctx.shadowColor=color;
    ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.arc(x,y,3.2+pulse*1.8,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}

}

function drawOpeningCinematic(ms,pulse){
  const tSec=ms/1000;

  if(ms<3200){
    const aIntro=ease(clamp(ms/1400));
    const pFill=clamp(ms/2800);
    const breathe=1+.015*Math.sin(tSec*2.5);
    const coreScale=mix(.42,.52,ease(pFill))*breathe*(1+pulse*.02);
    ctx.save();
    ctx.translate(CX,CY);
    ctx.scale(coreScale,coreScale);
    ctx.translate(-200,-200);
    for(let i=0;i<BASE_BOXES.length;i++){
      const b=BASE_BOXES[i];
      const lp=ease(clamp((pFill-i*0.20)/0.35));
      if(lp<=0)continue;
      ctx.globalAlpha=aIntro*b.a*lp*0.52;
      ctx.fillStyle='#87ceeb';
      rr(b.x,b.x,b.s,b.s,b.r);
      ctx.fill();
      if(lp<0.99){
        ctx.globalAlpha=aIntro*(1-lp*0.5)*0.36;
        ctx.strokeStyle='#00f0ff';
        ctx.lineWidth=mix(2.0,1.0,lp)/coreScale;
        rr(b.x,b.x,b.s,b.s,b.r);
        ctx.stroke();
      }else{
        ctx.globalAlpha=aIntro*0.12;
        ctx.strokeStyle='#87ceeb';
        ctx.lineWidth=1.0/coreScale;
        rr(b.x,b.x,b.s,b.s,b.r);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.save();
    const boxExtent=210*coreScale;
    drawCornerBrackets(CX-boxExtent,CY-boxExtent,boxExtent*2,boxExtent*2,12,'#00f0ff',.12*aIntro);
    ctx.restore();
    drawEditorialNarration("Hi, I’m Swarm.","THE LOCAL-FIRST AI WORKSPACE",aIntro,'#00f0ff');
    return;
  }
  if(ms<5000){
    const p=clamp((ms-3200)/1800);
    const coreScale=mix(.52,.54,ease(p))*(1+pulse*.02);
    drawExactSvgMark(CX,CY,coreScale,.52,pulse);
    ctx.save();
    const boxExtent=210*coreScale;
    drawCornerBrackets(CX-boxExtent,CY-boxExtent,boxExtent*2,boxExtent*2,12,'#00f0ff',.16);
    for(let l=0;l<BASE_BOXES.length;l++){
      const box=BASE_BOXES[l];
      const s=box.s*coreScale;
      ctx.strokeStyle=rgba(l>1?'#00f0ff':'#87ceeb',.08+pulse*.02);
      ctx.lineWidth=1.0;
      rr(CX-s/2,CY-s/2,s,s,box.r*coreScale);
      ctx.stroke();
    }
    ctx.restore();
    const crossFade=ease(clamp((ms-3200)/500));
    drawEditorialNarration("I’m an AI agent.","LOCAL ORCHESTRATION · ZERO CLOUD LATENCY",crossFade,'#00f0ff');
    return;
  }
  if(ms<7400){
    const p=clamp((ms-5000)/2400);
    const pEase=ease(p);
    const anchorTargetX=CX-1040/2+55;
    const curLogoX=mix(CX,anchorTargetX,pEase);
    const curLogoScale=mix(.54,.17,pEase)*(1+pulse*.02);
    const barLeft=curLogoX-55;
    const barRight=mix(curLogoX+55,CX+520,pEase);
    const barW=Math.max(110,barRight-barLeft);
    const barH=90;
    const barX=barLeft;
    const barY=CY-barH/2;
    ctx.save();
    ctx.fillStyle='rgba(2,6,12,0.94)';
    ctx.strokeStyle=rgba('#00f0ff',.08*pEase+.06+pulse*.02);
    ctx.lineWidth=1.4;
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=3*pEase;
    rr(barX,barY,barW,barH,12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur=0;
    drawCornerBrackets(barX,barY,barW,barH,14,'#00f0ff',.20*pEase);
    if(pEase>.3){
      const socketA=(pEase-.3)/.7;
      ctx.strokeStyle=rgba('#87ceeb',socketA*.25);
      ctx.lineWidth=1.0;
      rr(curLogoX-34,CY-34,68,68,8);
      ctx.stroke();
    }
    ctx.restore();
    drawCompactSwarmMark(curLogoX,CY,curLogoScale,.52,pulse);
    const crossFade=ease(clamp((ms-5000)/600));
    drawEditorialNarration("Tell me what you want to create.","NATURAL CREATIVE INTENT",crossFade,'#87ceeb');
    return;
  }
  if(ms<9900){
    const pType=clamp((ms-7400)/2300);
    const totalChars=PROMPT_TEXT.length;
    const count=Math.floor(pType*totalChars);
    const visibleStr=PROMPT_TEXT.slice(0,count);
    const pbW=1040,pbH=90,pbx=CX-pbW/2,pby=CY-pbH/2;
    const anchorX=pbx+55;
    const textStartX=pbx+112;
    const sendBtnX=pbx+pbW-55;
    ctx.save();
    ctx.fillStyle='rgba(2,6,12,0.94)';
    ctx.strokeStyle='rgba(0,240,255,0.16)';
    ctx.lineWidth=1.4;
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=3+pulse*2;
    rr(pbx,pby,pbW,pbH,12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur=0;
    drawCornerBrackets(pbx,pby,pbW,pbH,14,'#00f0ff',.24);
    ctx.strokeStyle='rgba(135,206,235,0.30)';
    ctx.lineWidth=1.0;
    rr(anchorX-34,CY-34,68,68,8);
    ctx.stroke();
    ctx.strokeStyle='rgba(135,206,235,0.15)';
    ctx.lineWidth=1.0;
    ctx.beginPath();
    ctx.moveTo(anchorX+34,CY);
    ctx.lineTo(textStartX-10,CY);
    ctx.stroke();
    ctx.font='600 24px ui-monospace,SFMono-Regular,Menlo,monospace';
    ctx.fillStyle='#ffffff';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=2;
    ctx.fillText(visibleStr,textStartX,CY);
    const textW=ctx.measureText(visibleStr).width;
    const cursorX=textStartX+textW+3;
    const cursorBlink=Math.sin(tSec*10)>-0.2;
    if(cursorBlink){
      ctx.fillStyle='#00f0ff';
      ctx.shadowColor='#00f0ff';
      ctx.shadowBlur=8;
      ctx.fillRect(cursorX,CY-15,3,30);
    }
    const sendW=44,sendH=44;
    const isFinishedTyping=count===totalChars;
    const sendAlpha=isFinishedTyping?.75:.35;
    ctx.fillStyle='rgba(10,24,38,0.6)';
    ctx.strokeStyle=rgba('#00f0ff',sendAlpha);
    ctx.lineWidth=1.2;
    rr(sendBtnX-sendW/2,CY-sendH/2,sendW,sendH,8);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle=rgba('#e0f2fe',sendAlpha);
    ctx.lineWidth=2.0;
    ctx.beginPath();
    ctx.moveTo(sendBtnX-7,CY);
    ctx.lineTo(sendBtnX+6,CY);
    ctx.moveTo(sendBtnX+1,CY-5);
    ctx.lineTo(sendBtnX+6,CY);
    ctx.lineTo(sendBtnX+1,CY+5);
    ctx.stroke();
    ctx.restore();
    drawCompactSwarmMark(anchorX,CY,.17,.52,pulse);
    drawEditorialNarration("Tell me what you want to create.","COMPOSING USER REQUEST",1,'#87ceeb');
    return;
  }
  if(ms<11800){
    const pbW=1040,pbH=90,pbx=CX-pbW/2,pby=CY-pbH/2;
    const anchorX=pbx+55,textStartX=pbx+112,sendBtnX=pbx+pbW-55;
    const pPress=ease(clamp((ms-9900)/320));
    const pPending=ease(clamp((ms-10220)/430));
    const pDepart=ease(clamp((ms-10950)/700));
    const barY=CY-mix(0,24,pDepart);
    const alpha=clamp(1-pDepart);
    const btnScale=pPress<.6?mix(1,.90,pPress/.6):mix(.90,1,(pPress-.6)/.4);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(1,3,7,0.96)';
    ctx.strokeStyle='rgba(135,206,235,0.13)';
    ctx.lineWidth=1;
    rr(pbx,barY-pbH/2,pbW,pbH,12);
    ctx.fill();
    ctx.stroke();
    drawCornerBrackets(pbx,barY-pbH/2,pbW,pbH,14,'#87ceeb',.13*alpha);

function drawProgressiveVariantLogo(c, r, cx, cy, scale, alpha, tSec, pulse, isSelected, genProgress) {
  const idx = r * 5 + c;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = alpha;

  if (isSelected) {
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 18 + pulse * 14;
  }

  // Level 1: Construction seeds
  if (genProgress < 0.35) {
    const pSeed = genProgress / 0.35;
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, 0, mix(1, 4, pSeed), 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(135,206,235,0.4)';
    ctx.lineWidth = 1.0;
    ctx.strokeRect(-15 * pSeed, -15 * pSeed, 30 * pSeed, 30 * pSeed);
    ctx.restore();
    return;
  }
  // Level 2 & 3: Progressive Box Rendering
  for (let l = 0; l < BASE_BOXES.length; l++) {
    const b = BASE_BOXES[l];
    let layerAlpha = b.a * alpha * clamp((genProgress - 0.2) / 0.5);
    let s = b.s * scale;
    let rad = b.r * scale;
    let col = '#87ceeb';

    if (idx === 0) {
      const wave = Math.sin(l * 1.5 - tSec * 6 + c * 0.8);
      col = wave > 0.2 ? '#00f0ff' : '#87ceeb';
      layerAlpha *= 0.8 + wave * 0.4;
    } else if (idx === 1) {
      col = l === 3 ? '#ffffff' : l === 2 ? '#00f0ff' : l === 1 ? '#87ceeb' : '#8b5cf6';
    } else if (idx === 2) {
      col = l === 3 ? '#ffffff' : '#00f0ff';
    } else if (idx === 3) {
      col = l === 3 ? '#ff7edb' : l === 2 ? '#00f0ff' : '#87ceeb';
    } else if (idx === 4) {
      s *= 1 + 0.06 * Math.sin(tSec * 4 + l * 0.8);
    } else if (idx === 5) {
      col = l > 1 ? '#e0f2fe' : '#00f0ff';
    } else if (idx === 6) {
      const scanY = (tSec * 1.8 + c * 0.2) % 1;
      if (Math.abs(l / 3 - scanY) < 0.25) col = '#ffffff';
    } else if (idx === 7) {
      col = l % 2 === 0 ? '#00f0ff' : '#e0f2fe';
    } else if (idx === 8) {
      col = l === 3 ? '#fcd34d' : '#00ff88';
    } else if (idx === 9) {
      col = '#00ff88';
    } else if (idx === 10) {
      col = l === 3 ? '#ffffff' : '#87ceeb';
    } else if (idx === 11) {
      rad *= 1 + 0.15 * Math.sin(tSec * 5 + l);
    } else if (idx === 12) {
      col = l === 3 ? '#ffffff' : l === 2 ? '#e0f2fe' : l === 1 ? '#00f0ff' : '#87ceeb';
      layerAlpha = Math.min(1, layerAlpha * 1.35);
    } else if (idx === 13) {
      col = Math.sin(tSec * 12 + idx) > 0 ? '#00f0ff' : '#87ceeb';
    } else if (idx === 14) {
      s *= 1 + 0.04 * Math.cos(tSec * 8 + l * 1.2);
    } else if (idx === 15) {
      col = l === 3 ? '#ffffff' : '#87ceeb';
    } else if (idx === 16) {
      col = l > 1 ? '#00f0ff' : '#8b5cf6';
    } else if (idx === 17) {
      col = '#e0f2fe';
    } else if (idx === 18) {
      col = l === 3 ? '#00ff88' : '#87ceeb';
    } else if (idx === 19) {
      col = l === 3 ? '#ffffff' : '#00f0ff';
    } else if (idx === 20) {
      col = l === 3 ? '#fcd34d' : '#ff7edb';
    } else if (idx === 21) {
      col = '#00ff88';
    } else if (idx === 22) {
      col = l === 3 ? '#ffffff' : l === 2 ? '#fcd34d' : '#87ceeb';
    } else if (idx === 23) {
      col = '#87ceeb';
    } else if (idx === 24) {
      col = l === 3 ? '#ffffff' : '#e0f2fe';
    }
    ctx.globalAlpha = layerAlpha;
    ctx.fillStyle = col;
    rr(-s / 2, -s / 2, s, s, rad);
    ctx.fill();

    if (isSelected || l === 3 || idx === 12) {
      ctx.strokeStyle = isSelected ? '#ffffff' : col;
      ctx.lineWidth = isSelected ? 1.6 : 1.2;
      rr(-s / 2, -s / 2, s, s, rad);
      ctx.stroke();
    }
  }
  if (isSelected) {
    const boxW = 140, boxH = 84;
    ctx.strokeStyle = rgba('#ffffff', 0.95);
    ctx.lineWidth = 1.8;
    rr(-boxW / 2, -boxH / 2, boxW, boxH, 8);
    ctx.stroke();
    drawCornerBrackets(-boxW / 2, -boxH / 2, boxW, boxH, 10, '#ffffff', 1);

    ctx.fillStyle = 'rgba(0,240,255,0.22)';
    ctx.strokeStyle = rgba('#00f0ff', 0.8);
    ctx.lineWidth = 1.0;
    rr(-100, boxH / 2 + 8, 200, 20, 4);
    ctx.fill();
    ctx.stroke();
    ctx.font = '800 9px ui-monospace,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SELECTED // KINETIC CRYSTALLINE', 0, boxH / 2 + 18);
  }
  ctx.restore();
}

function getPathPoint(pathData, progress) {
  const pts = pathData.pts;
  const segLengths = pathData.segLengths;
  const totalLength = pathData.totalLength;
  if (totalLength === 0 || pts.length === 0) return { x: 0, y: 0, heading: 0 };
  if (progress <= 0) {
    const heading = pts.length > 1 ? Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) : 0;
    return { x: pts[0].x, y: pts[0].y, heading };
  }
  if (progress >= 1) {
    const last = pts.length - 1;
    const heading = last > 0 ? Math.atan2(pts[last].y - pts[last - 1].y, pts[last].x - pts[last - 1].x) : 0;
    return { x: pts[last].x, y: pts[last].y, heading };
  }
  const targetDist = progress * totalLength;
  let accum = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const segLen = segLengths[i];
    if (accum + segLen >= targetDist) {
      const segT = (targetDist - accum) / (segLen || 1);
      const x = mix(pts[i].x, pts[i + 1].x, segT);
      const y = mix(pts[i].y, pts[i + 1].y, segT);
      const heading = Math.atan2(pts[i + 1].y - pts[i].y, pts[i + 1].x - pts[i].x);
      return { x, y, heading };
    }
    accum += segLen;
  }
  const last = pts.length - 1;
  const heading = last > 0 ? Math.atan2(pts[last].y - pts[last - 1].y, pts[last].x - pts[last - 1].x) : 0;
  return { x: pts[last].x, y: pts[last].y, heading };
}

// Deterministic electrical current rendered only on the canonical logo contour.
function drawEmbeddedFinderCurrent(ctx, pathData, progress, color, pulse, tSec, scale, isDiscovererHalt=false) {
  const pts = pathData.pts;
  const segLengths = pathData.segLengths;
  const totalLength = pathData.totalLength;
  if (progress <= 0 || totalLength === 0 || pts.length === 0) return;

  const targetDist = progress * totalLength;
  let accum = 0;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // A restrained energized wake: every pixel remains centered on the logo line.
  ctx.beginPath();
  ctx.moveTo(pts[0].x * scale, pts[0].y * scale);
  for (let i = 0; i < pts.length - 1; i++) {
    const segLen = segLengths[i];
    if (accum + segLen >= targetDist) {
      const segT = (targetDist - accum) / (segLen || 1);
      ctx.lineTo(mix(pts[i].x, pts[i + 1].x, segT) * scale, mix(pts[i].y, pts[i + 1].y, segT) * scale);
      break;
    }
    ctx.lineTo(pts[i + 1].x * scale, pts[i + 1].y * scale);
    accum += segLen;
  }
  ctx.strokeStyle = rgba(color, 0.32 + pulse * 0.12);
  ctx.lineWidth = 7.5 * scale;
  ctx.shadowColor = color;
  ctx.shadowBlur = (18 + pulse * 10) * scale;
  ctx.stroke();
  ctx.strokeStyle = rgba(color, 0.95);
  ctx.lineWidth = 2.15 * scale;
  ctx.shadowBlur = 8 * scale;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 0.72 * scale;
  ctx.shadowBlur = 0;
  ctx.stroke();

  // Five compact charge packets form a coherent train behind the leading edge.
  const packetSpacing = 0.026;
  for (let k = 0; k < 5; k++) {
    const pp = Math.max(0, progress - k * packetSpacing);
    const p = getPathPoint(pathData, pp);
    const energy = 1 - k / 6;
    ctx.fillStyle = k === 0 ? '#ffffff' : rgba(color, energy);
    ctx.shadowColor = color;
    ctx.shadowBlur = (k === 0 ? 20 : 11) * scale * energy;
    ctx.beginPath();
    ctx.arc(p.x * scale, p.y * scale, (k === 0 ? 3.6 : 2.1) * scale * energy, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawSolderPad(ctx, x, y, color, isPowered, pulse) {
  ctx.save();
  ctx.fillStyle = 'rgba(2, 8, 16, 0.9)';
  ctx.strokeStyle = rgba(color, isPowered ? 0.9 : 0.45);
  ctx.lineWidth = isPowered ? 1.8 : 1.2;
  if (isPowered) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 8 + pulse * 4;
  }
  ctx.beginPath();
  ctx.arc(x, y, 4.5, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = isPowered ? '#ffffff' : 'rgba(135, 206, 235, 0.3)';
  ctx.beginPath();
  ctx.arc(x, y, 1.6, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawCircuitBlueprint(ctx, scale, alpha, pulse, pActivate) {
  ctx.save();
  ctx.globalAlpha = alpha;

  // 4 Nested rounded square plates with subtle blueprint fills
  for (let l = 0; l < BASE_BOXES.length; l++) {
    const b = BASE_BOXES[l];
    const s = b.s * scale;
    const r = b.r * scale;
    const layerCurrent = l === 0 ? clamp((pActivate - 0.0) / 0.35) :
                         l === 1 ? clamp((pActivate - 0.15) / 0.35) :
                         l === 2 ? clamp((pActivate - 0.30) / 0.35) :
                                   clamp((pActivate - 0.45) / 0.35);

    // Line-only mark: no plates or decorative substrate.

    // Canonical logo contour
    const borderCol = layerCurrent > 0.5 ? '#00f0ff' : '#87ceeb';
    const borderA = mix(0.18, 0.85, layerCurrent);
    ctx.strokeStyle = rgba(borderCol, borderA);
    ctx.lineWidth = mix(1.0, 1.6, layerCurrent);
    if (layerCurrent > 0.7) {
      ctx.shadowColor = borderCol;
      ctx.shadowBlur = 8 + pulse * 6;
    }
    rr(-s / 2, -s / 2, s, s, r);
    ctx.stroke();
    ctx.shadowBlur = 0;

  }

  // No secondary tracks, buses, vias, brackets, cards, or off-logo decoration.

  ctx.restore();
}

const FINDER_SNAKE_COLORS = Object.freeze(['#00f0ff','#87ceeb','#e0f2fe','#8b5cf6','#00ffb7']);
const FINDER_CLOUD = Object.freeze(Array.from({length:920},(_,i)=>Object.freeze({
  x:80+hash(i*5.31)*1760,
  y:145+hash(i*9.17+4)*705,
  z:hash(i*2.73+11),
  phase:hash(i*7.91+3)*TAU
})));

function finderSnakePoint(index,u,tSec){
  u=clamp(u);
  const lane=255+index*132;
  const weave=Math.sin(u*TAU*(1.25+index*.075)+index*1.31+tSec*.16)*62;
  const ripple=Math.sin(u*TAU*3.25-index*.83-tSec*.28)*19;
  const crossing=Math.sin(u*Math.PI)*Math.sin(index*1.7+u*TAU)*28;
  return {x:95+u*1730,y:lane+weave+ripple+crossing};
}

function drawFinderParticleCloud(ms,pulse){
  const tSec=ms/1000;
  const intro=ease(clamp((ms-20220)/720));
  const exit=ease(clamp((ms-27220)/380));
  const alpha=intro*(1-exit*.08);
  const travel=clamp((ms-20520)/5450);
  const surge=ease(clamp((ms-25900)/1300));
  const tails=[];

  for(let i=0;i<5;i++){
    const head=clamp((travel*1.12-i*.045));
    const length=mix(.13,.235,ease(head));
    const samples=[];
    for(let s=0;s<34;s++){
      const u=Math.max(0,head-(s/33)*length);
      samples.push({...finderSnakePoint(i,u,tSec),u,fade:1-s/34});
    }
    tails.push({head,samples,color:FINDER_SNAKE_COLORS[i]});
  }

  ctx.save();
  ctx.globalAlpha=alpha;

  // Deep granular field. Nearby particles are pushed aside and energized by
  // the five bodies, making their passage legible without cards or geometry.
  for(let i=0;i<FINDER_CLOUD.length;i++){
    const p=FINDER_CLOUD[i];
    let x=p.x+Math.sin(tSec*.19+p.phase)*mix(2,11,p.z);
    let y=p.y+Math.cos(tSec*.16+p.phase*1.7)*mix(2,9,p.z);
    let nearest=999,nearestColor='#87ceeb',pushX=0,pushY=0;
    for(let f=0;f<tails.length;f++){
      const sample=tails[f].samples[(i+f*7)%tails[f].samples.length];
      if(tails[f].head<=0)continue;
      const dx=x-sample.x,dy=y-sample.y,d=Math.hypot(dx,dy);
      if(d<nearest){nearest=d;nearestColor=tails[f].color;pushX=dx;pushY=dy;}
    }
    const influence=clamp(1-nearest/118);
    if(influence>0){
      const inv=1/(nearest||1);
      x+=pushX*inv*influence*20;
      y+=pushY*inv*influence*20;
    }
    const baseA=mix(.08,.32,p.z);
    const a=baseA+influence*.68+surge*.08;
    const r=mix(.65,2.05,p.z)+influence*1.8;
    ctx.fillStyle=rgba(influence>.06?nearestColor:'#87ceeb',a);
    ctx.shadowColor=nearestColor;
    ctx.shadowBlur=influence*11;
    ctx.beginPath();
    ctx.arc(x,y,r,0,TAU);
    ctx.fill();
  }

  // Continuous serpentine Finder bodies: broad atmospheric displacement,
  // colored plasma skin, then a white-hot conductive core.
  tails.forEach((tail,index)=>{
    if(tail.head<=0)return;
    const pts=tail.samples.slice().reverse();
    const trace=()=>{
      ctx.beginPath();
      pts.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    };
    ctx.lineCap='round';ctx.lineJoin='round';
    trace();
    ctx.strokeStyle=rgba(tail.color,.15+pulse*.05);
    ctx.lineWidth=38;
    ctx.shadowColor=tail.color;ctx.shadowBlur=32;
    ctx.stroke();
    trace();
    ctx.strokeStyle=rgba(tail.color,.92);
    ctx.lineWidth=9;
    ctx.shadowBlur=18;
    ctx.stroke();
    trace();
    ctx.strokeStyle='rgba(255,255,255,.90)';
    ctx.lineWidth=2.1;
    ctx.shadowBlur=5;
    ctx.stroke();

    for(let k=0;k<7;k++){
      const p=tail.samples[Math.min(k*3,tail.samples.length-1)];
      const energy=1-k/8;
      ctx.fillStyle=k===0?'#ffffff':rgba(tail.color,energy*.9);
      ctx.shadowColor=tail.color;ctx.shadowBlur=18*energy;
      ctx.beginPath();ctx.arc(p.x,p.y,(k===0?6.2:3.2)*energy,0,TAU);ctx.fill();
    }
  });

  // Final cloud coherence is expressed as a denser shared current—not a logo,
  // ring, explosion, or separate overlay.
  if(surge>0){
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=alpha*surge*.16;
    ctx.fillStyle='#87ceeb';
    ctx.fillRect(0,170,W,640);
  }
  ctx.restore();

  if(ms<21800)drawEditorialNarration('I send five Finders into the unknown.','5 CONCURRENT SEARCH CURRENTS',alpha,'#00f0ff');
  else if(ms<24200)drawEditorialNarration('Each one takes a different path.','SEARCHING THE SAME FIELD IN PARALLEL',alpha,'#00f0ff');
  else if(ms<25300)drawEditorialNarration('They move through the noise together.','FIVE PATHS · ONE SHARED CONTEXT',alpha,'#87ceeb');
  else if(ms<26400)drawEditorialNarration('Every trail changes what the others can see.','COLLECTIVE SEARCH FIELD',alpha,'#e0f2fe');
  else drawEditorialNarration('The cloud resolves into a shared direction.','PARALLEL DISCOVERY CONVERGED',alpha,'#00f0ff');
}

function drawStep03Sequence(ms, pulse){
  const tSec = ms / 1000;

  // ==================================================
  // PHASE A: UNDERSTAND (20,220ms – 27,600ms) - Layered Circuit Swarm SVG Search & Repair
  // ==================================================
  if (ms < 27600) {
    drawFinderParticleCloud(ms,pulse);
    return;

    const pIntro = ease(clamp((ms - 20220) / 900));
    const pSearch = clamp((ms - 21120) / 3080); // 21120 to 24200: search
    const pDiscover = clamp((ms - 24200) / 600); // 24200 to 24800: discovery & halt at fault
    const pConverge = ease(clamp((ms - 24800) / 700)); // 24800 to 25500: reroute & converge
    const pBridge = clamp((ms - 25500) / 600); // 25500 to 26100: synthesize bridge
    const pSurge = clamp((ms - 26100) / 300); // 26100 to 26400: lock surge
    const pActivate = clamp((ms - 26300) / 1200); // 26300 to 27500: 4-layer activation cascade
    const pOut = ease(clamp((ms - 27200) / 400));
    const alpha = pIntro * (1 - pOut * 0.05);

    const circuitScale = mix(1.05, 1.15, pIntro);
    const originX = CX;
    const originY = CY - 15;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(originX, originY);

    // 1. Draw Layered Circuit Blueprint (Plates, Concentric Tracks, Bus Traces, Solder Pads)
    drawCircuitBlueprint(ctx, circuitScale, alpha, pulse, pActivate);

    // Draw five structurally embedded currents. No labels or terminal ornaments.
    // Two counter-running currents share layer three; all motion remains on the mark.

    // 3. Draw 5 Structurally Embedded Finder Currents inside SVG tracks
    FINDER_CIRCUIT_PATHS.forEach((fPath, idx) => {
      let pt, curProgress;
      const isDiscoverer = (idx === 2 || idx === 4);

      if (pConverge > 0) {
        const cProgress = isDiscoverer ? 1.0 : clamp((pConverge * 1.08 - idx * 0.035) / 1.0);
        curProgress = cProgress;
        drawEmbeddedFinderCurrent(ctx, fPath.converge, cProgress, fPath.color, pulse, tSec, circuitScale, isDiscoverer);
      } else if (pSearch > 0) {
        const sProgress = clamp((pSearch * 1.05 - idx * 0.02) / 1.0);
        curProgress = sProgress;

        ctx.textBaseline = 'middle';
        ctx.fillStyle = lane.c;
        ctx.fillText(lane.label, tlX + 14, ly + 26);

        lane.clips.forEach(clip => {
          const clipProgress = ease(clamp((pExecAction * 1300 - (clip.x - tlX)) / 260));
          if (clipProgress <= 0) return;
          const curW = clip.w * clipProgress;

          ctx.fillStyle = rgba(lane.c, 0.22);
          ctx.strokeStyle = rgba(lane.c, 0.65);
          ctx.lineWidth = 1.0;
          rr(clip.x, ly + 6, curW, 40, 4);
          ctx.fill();
          ctx.stroke();

          if (lane.isWaveform) {
            ctx.strokeStyle = rgba(lane.c, 0.7);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let wx = clip.x + 8; wx < clip.x + curW - 8; wx += 6) {
              const waveHeight = Math.abs(Math.sin(wx * 0.08 + tSec * 2)) * 15 + 2;
              ctx.moveTo(wx, ly + 26 - waveHeight);
              ctx.lineTo(wx, ly + 26 + waveHeight);
            }
            ctx.stroke();
          }

          if (clipProgress > 0.4) {
            ctx.save();
            ctx.globalAlpha = tlAlpha * (clipProgress - 0.4) / 0.6;
            ctx.font = '600 9px ui-monospace,monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(clip.t, clip.x + 12, ly + 26);
            ctx.restore();
          }
        });
      });

      const playheadX = tlX + 160 + pPlayhead * 980;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.0;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(playheadX, tlY + 6);
      ctx.lineTo(playheadX, tlY + tlH - 8);
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(playheadX - 6, tlY + 6);
      ctx.lineTo(playheadX + 6, tlY + 6);
      ctx.lineTo(playheadX, tlY + 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // Bottom Narration Progression
    if (ms < 36400) {
      drawEditorialNarration("Recreate my onboarding video with a TUI demo and polished Desktop footage.", "NATURAL PRODUCT GOAL", alpha, "#00ff88");
    } else if (ms < 39200) {
      drawEditorialNarration("First, I turn the idea into a plan.", "7 ORDERED CHECKPOINTS // DEPENDENCY-READY", alpha, "#87ceeb");
    } else if (ms < 41800) {
      drawEditorialNarration("Then I delegate each part.", "PARALLEL SESSIONS & SPECIALIST SWARMS", alpha, "#00f0ff");
    } else if (ms < 44500) {
      drawEditorialNarration("The work comes back into one timeline.", "MULTITRACK TIMELINE · FRAME-ACCURATE SYNC", alpha, "#00ff88");
    } else if (ms < 46200) {
      drawEditorialNarration("I review the complete cut.", "AUTOMATED VERIFICATION & QUALITY GATES", alpha, "#87ceeb");
    } else {
      drawEditorialNarration("One idea. One plan. One finished video.", "1920×1080 60FPS LOSSLESS MASTER // READY TO SHIP", alpha, "#00ff88");
    }
  }
}

function drawNetwork(ms,pulse){

// ----------------------------------------------------
// SCENE 8: FINAL DROP & APEX LED CONVERGENCE (55400ms - 61400ms) - LOCKED SOURCE
// ----------------------------------------------------
function drawFinalDrop(ms,pulse){
  const tSec=ms/1000;
  const p=clamp((ms-55400)/6000);
  const hit=clamp((ms-55400)/900);

  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<FINAL_DROP_GRID.length;i++){
    const pt=FINAL_DROP_GRID[i];
    const ambient=.5+.5*Math.sin(pt.x*.02+pt.y*.02+tSec*3);
    const lit=pt.layer>=0;
    const a=lit?BASE_BOXES[pt.layer].a*(.75+ambient*.25):.02+ambient*.02;
    if(lit){
      const sprite=pt.layer===3?SPRITES.layer3:pt.layer===2?SPRITES.layer2:pt.layer===1?SPRITES.layer1:SPRITES.layer0;
      const dSize=18+pulse*6;
      ctx.globalAlpha=a;
      ctx.drawImage(sprite,pt.x-dSize/2,pt.y-dSize/2,dSize,dSize);
    }else{
      ctx.fillStyle='rgba(0,240,255,0.08)';
      ctx.fillRect(pt.x-1,pt.y-1,2,2);
    }
  }
  ctx.restore();
  if(hit<1){
    ctx.strokeStyle=rgba('#ffffff',(1-hit)*.95);
    ctx.lineWidth=12*(1-hit)+1;
    ctx.beginPath();
    ctx.arc(CX,CY,mix(50,1200,hit),0,TAU);
    ctx.stroke();
  }
  const scale=mix(.55,.82,ease(p));
  drawAsciiMark(CX,CY,scale,1,pulse,true);
  drawLedMark(CX,CY,scale*.75,1,pulse,9);

  for(let b=0;b<3;b++){
    const wavePhase=((tSec*1.5+b*.33)%1);
    const radius=mix(120,950,out(wavePhase));
    ctx.save();
    ctx.strokeStyle=rgba(b%2===0?'#00f0ff':'#87ceeb',(1-wavePhase)*.7);
    ctx.lineWidth=3*(1-wavePhase)+1;
    ctx.shadowColor='#00f0ff';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(CX,CY,radius,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
  drawBanner('SWARM // THE LOCAL-FIRST AI WORKSPACE','TAKE BACK CONTROL OF YOUR DEVELOPMENT WORKFLOW','APEX CONVERGENCE',110,'#00f0ff',1,pulse);
  drawTracked('SHIP SOFTWARE AT THE SPEED OF THOUGHT // SWARMAGENT.DEV',CX,945,5,'#00ff88',.95,'700 16px ui-monospace,monospace');
}

// ----------------------------------------------------
// SCENE 9: SINGULARITY (61400ms - 62160ms) - LOCKED SOURCE
// ----------------------------------------------------
function drawSingularity(ms){
  const p=ease(clamp((ms-61400)/760));
  ctx.save();
  ctx.globalCompositeOperation='lighter';

  for(let i=0;i<96;i++){
    const a=i/96*TAU,r=mix(980,4,p)*(0.7+hash(i)*.35),twist=a+p*4.2;
    const x=CX+Math.cos(twist)*r,y=CY+Math.sin(twist)*r;
    ctx.strokeStyle=rgba(i%3===0?'#00f0ff':i%3===1?'#e0f2fe':'#8b5cf6',(1-p)*.7);
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.lineTo(x,y);
    ctx.stroke();
  }
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,mix(280,10,p));
  g.addColorStop(0,'#ffffff');
  g.addColorStop(.3,rgba('#e0f2fe',.95));
  g.addColorStop(1,rgba('#00f0ff',0));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(CX,CY,mix(280,10,p),0,TAU);
  ctx.fill();
  ctx.restore();
}

// ----------------------------------------------------
// SCENE 10: CANONICAL RESOLUTION (62160ms - 63400ms) - LOCKED SOURCE
// ----------------------------------------------------
function drawResolution(ms){
  const p=ease(clamp((ms-62160)/950)),scale=mix(.32,.54,p);
  ctx.save();
  ctx.translate(CX,CY-50);
  ctx.scale(scale,scale);
  ctx.translate(-200,-200);
  ctx.shadowColor='#00f0ff';
  ctx.shadowBlur=mix(60,24,p);
  for(const b of BASE_BOXES){
    ctx.globalAlpha=p*b.a;
    ctx.fillStyle='#87ceeb';
    rr(b.x,b.x,b.s,b.s,b.r);
    ctx.fill();
  }
  ctx.restore();

  drawTracked('SWARM',CX,830,20,'#ffffff',p,'800 48px Inter,system-ui,sans-serif');
  drawTracked('THE LOCAL-FIRST AI WORKSPACE',CX,895,6,'#87ceeb',p*.9,'700 16px Inter,system-ui,sans-serif');

}

// ----------------------------------------------------
// MAIN DRAW LOOP
// ----------------------------------------------------
function draw(ms){
  ms=clamp(Number(ms)||0,0,DURATION);
  const pulse=pulseAt(ms);
  const energy=ms<20220?(-.48+ease(ms/20220)*.08+pulse*.035):(.22+ease(ms/55400)*.4+pulse*.38);

  ctx.clearRect(0,0,W,H);
  drawBackground(ms,energy);

  if(ms<20220)drawOpeningCinematic(ms,pulse);
  else if(ms<48120)drawStep03Sequence(ms,pulse);
  else if(ms<55400)drawNetwork(ms,pulse);
  else if(ms<61400)drawFinalDrop(ms,pulse);
  else if(ms<62160)drawSingularity(ms);
  else drawResolution(ms);
}

// ----------------------------------------------------
// SCHEDULER & ANIMATION EXPORT CONTRACTS
// ----------------------------------------------------
let isPlaying=false;
let rafId=0;
let playbackStartTime=0;
let playbackStartMs=0;
let currentMs=0;

const prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const playBtn=document.getElementById('play');
const range=document.getElementById('timeline');
const clock=document.getElementById('clock');
const audio=document.getElementById('soundtrack');
const nav=document.getElementById('moments');

const format=ms=>{
  const t=Math.max(0,Math.min(63400,ms)),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),x=Math.floor(t%1000);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(x).padStart(3,'0')}`;
};

function updateMoment(ms){
  const active=MOMENTS.find(m=>ms>=m.start&&ms<m.end)||MOMENTS[MOMENTS.length-1];
  if(nav){
    nav.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',MOMENTS[i]===active));
  }
}

function updateUI(ms){
  if(range&&Number(range.value)!==Math.round(ms))range.value=String(Math.round(ms));
  if(clock)clock.textContent=format(ms);
  updateMoment(ms);
}

function renderFrame(ms){
  ensureInit();
  currentMs=clamp(Number(ms)||0,0,DURATION);
  document.documentElement.dataset.swarmAnimationTimeMs=String(currentMs);
  draw(currentMs);
  updateUI(currentMs);
}

function startPlayback(fromMs){
  if(prefersReducedMotion){
    renderFrame(fromMs!==undefined?fromMs:0);
    return;
  }
  if(fromMs!==undefined){
    playbackStartMs=clamp(fromMs,0,DURATION);
  }else{
    playbackStartMs=currentMs>=DURATION?0:currentMs;
  }
  playbackStartTime=performance.now();
  isPlaying=true;
  if(playBtn)playBtn.textContent='Pause';

  if(audio){
    audio.currentTime=playbackStartMs/1000;
    audio.play().catch(()=>{});
  }
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(animationLoop);
}

function pausePlayback(){
  isPlaying=false;
  cancelAnimationFrame(rafId);
  if(playBtn)playBtn.textContent='Play';
  if(audio)audio.pause();
}

function animationLoop(now){
  if(!isPlaying)return;
  const elapsed=now-playbackStartTime;
  const ms=playbackStartMs+elapsed;
  if(ms>=DURATION){
    renderFrame(DURATION);
    pausePlayback();
    return;
  }
  renderFrame(ms);

  if(audio&&!audio.paused&&Math.abs(audio.currentTime-ms/1000)>0.15){
    audio.currentTime=ms/1000;
  }
  rafId=requestAnimationFrame(animationLoop);
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    if(isPlaying){
      pausePlayback();
      document.documentElement.dataset.wasPlaying='true';
    }
  }else{
    if(document.documentElement.dataset.wasPlaying==='true'){
      delete document.documentElement.dataset.wasPlaying;
      startPlayback(currentMs);
    }
  }
});

async function ready(){
  if(document.fonts?.ready){
    try{await document.fonts.ready}catch(_){}
  }
  ensureInit();
  renderFrame(0);
  return{duration_ms:DURATION,fps:FPS};
}

async function seek(timeMs){
  ensureInit();
  const ms=clamp(Number(timeMs)||0,0,DURATION);
  if(isPlaying){
    pausePlayback();
  }
  renderFrame(ms);
  if(audio){
    audio.currentTime=ms/1000;
  }
  await new Promise(resolve=>requestAnimationFrame(resolve));
  return{time_ms:ms};
}

globalThis.SWARM_MOMENTS=MOMENTS;
globalThis.SWARM_FEATURES=FEATURES;
globalThis.SWARM_AUDIO_LINEAGE=AUDIO_LINEAGE;
globalThis.__SWARM_ANIMATION_V1__={version:'swarm.animation/v1',ready,seek};
globalThis.__SWARM_LOCAL_PREVIEW__={show:seek,stop:pausePlayback,moments:MOMENTS};

if(playBtn){
  playBtn.addEventListener('click',()=>{
    if(isPlaying)pausePlayback();
    else startPlayback();
  });
}
if(range){
  range.addEventListener('input',()=>{
    seek(Number(range.value));
  });
}
if(nav){
  const iterationManifestNode=document.getElementById('swarm-iteration-manifest');
  let iterationSections=[];
  try{iterationSections=JSON.parse(iterationManifestNode?.textContent||'null')?.sections||[];}catch(_){}
  for(const m of MOMENTS){
    const b=document.createElement('button');
    b.type='button';
    b.textContent=m.label;
    const section=iterationSections.find(item=>item.id===m.id);
    const narration=section?.narration?.map(line=>[line.text,line.detail].filter(Boolean).join(' — ')).filter(Boolean).join('\n');
    if(narration)b.title=narration;
    b.addEventListener('click',()=>{
      seek(m.start);
    });
    nav.appendChild(b);
  }
}

window.addEventListener('DOMContentLoaded',()=>{
  ensureInit();
  const urlParam=new URLSearchParams(location.search).get('t');
  const initialMs=urlParam!==null?clamp(Number(urlParam)||0,DURATION):0;
  renderFrame(initialMs);

  if(!prefersReducedMotion&&!document.hidden&&urlParam===null){
    startPlayback(0);
  }
},{once:true});

})();
</script>
<script data-swarm-player-bridge>
(()=>{
  const protocol='swarm-player/v1';
  const iterationManifest=()=>{
    const node=document.getElementById('swarm-iteration-manifest');
    if(!node)return null;
    try{return JSON.parse(node.textContent||'null');}catch(_){return null;}
  };

  addEventListener('message',async event=>{
    const data=event.data;
    if(!data||data.protocol!==protocol||!data.id)return;
    try{
      let result=null;
      if(data.type==='ready')result=await globalThis.__SWARM_ANIMATION_V1__.ready();
      else if(data.type==='describe')result=iterationManifest();
      else if(data.type==='seek')result=await globalThis.__SWARM_ANIMATION_V1__.seek(data.time_ms);
      else if(data.type==='stop'){
        try{globalThis.__SWARM_LOCAL_PREVIEW__?.stop?.()}catch(_){}
        document.querySelectorAll('audio,video').forEach(media=>{media.pause();media.muted=true});
        result={stopped:true};
      }else return;
      event.source?.postMessage({protocol,id:data.id,ok:true,result},'*');
    }catch(err){
      event.source?.postMessage({protocol,id:data.id,ok:false,error:err?.message||String(err)},'*');
    }
  });
})();
</script>
