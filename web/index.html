<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Swarm" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Swarm Desktop</title>
    <script>
      (() => {
        const rootReserved = new Set(['settings', 'integrations', 'tools', 'flow'])
        const workspaceReserved = new Set(['settings', 'tools', 'flow'])
        const parts = window.location.pathname.split('/').map((part) => {
          try {
            return decodeURIComponent(part).trim()
          } catch {
            return ''
          }
        }).filter(Boolean)
        if (parts.length !== 2) return
        const [workspaceSlug, sessionId] = parts
        if (!workspaceSlug || !sessionId || rootReserved.has(workspaceSlug) || workspaceReserved.has(sessionId)) return
        const startedAt = performance.now()
        window.__swarmV3SessionPreload = {
          sessionId,
          startedAt,
          promise: fetch(`/v3/sessions/${encodeURIComponent(sessionId)}`, {
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          }).then((response) => {
            if (!response.ok) return null
            return response.json()
          }).catch(() => null),
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
