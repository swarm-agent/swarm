name: require-changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

jobs:
  require-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted immutable verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/gcp-result-relay.py
          sparse-checkout-cone-mode: false
      - name: Verify exact GCP result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_CHECK_APP_ID: ${{ vars.GCP_CHECK_APP_ID }}
          GCP_CHECK_CONTEXT: require-changelog
        run: python3 -I scripts/gcp-result-relay.py
