name: build-main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'dev') || github.actor == 'swarm-agent' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: ./scripts/check-secrets.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack pnpm --version

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            short_sha="${GITHUB_SHA::12}"
            version="pr-${{ github.event.pull_request.number }}-${short_sha}"
            prerelease="true"
          else
            version="$(./scripts/resolve-release-version.sh)"
            prerelease="false"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag when missing
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git describe --tags --exact-match >/dev/null 2>&1; then
            echo "exact tag already present on HEAD"
            exit 0
          fi
          version="${{ steps.version.outputs.version }}"
          if git rev-parse "${version}" >/dev/null 2>&1; then
            echo "release tag already exists: ${version}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${version}" -m "Release ${version}"
          git push origin "refs/tags/${version}"

      - name: Build release bundle
        run: ./scripts/build-main-dist.sh --output-dir dist --version "${{ steps.version.outputs.version }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: main-build-${{ steps.version.outputs.version }}
          path: |
            dist/linux-amd64
            dist/web
            dist/build-info.txt
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/build-info.txt
