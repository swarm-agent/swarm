name: build-main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-stable-release:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.input.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Consume exact merged GCP release input
        id: input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_CHECK_APP_ID: ${{ secrets.GCP_CHECK_APP_ID || vars.GCP_CHECK_APP_ID }}
          GCP_CHECK_CONTEXT: build-main
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_READ_SERVICE_ACCOUNT: ${{ secrets.GCP_READ_SERVICE_ACCOUNT || vars.GCP_READ_SERVICE_ACCOUNT }}
          GCP_ALLOWED_BUCKETS: ${{ secrets.GCP_ALLOWED_BUCKETS || vars.GCP_ALLOWED_BUCKETS }}
          GCP_RELEASE_POLICY_JSON: ${{ secrets.GCP_RELEASE_POLICY_JSON || vars.GCP_RELEASE_POLICY_JSON }}
          GCP_RELEASE_POLICY_PATH: ${{ runner.temp }}/release-policy.json
          GCP_OUTPUT_DIR: dist
        run: |
          set -euo pipefail
          : "${GCP_CHECK_APP_ID:?approved App ID required}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?read-only WIF required}"
          : "${GCP_READ_SERVICE_ACCOUNT:?read-only service account required}"
          : "${GCP_ALLOWED_BUCKETS:?approved buckets required}"
          if [[ -n "${GCP_RELEASE_POLICY_JSON:-}" ]]; then
            printf '%s' "${GCP_RELEASE_POLICY_JSON}" > "${GCP_RELEASE_POLICY_PATH}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            GCP_RELEASE_VERSION="dispatch-${GITHUB_SHA::12}"
          else
            GCP_RELEASE_VERSION="$(./scripts/resolve-release-version.sh)"
          fi
          export GCP_RELEASE_VERSION
          python3 -B scripts/gcp-release-input.py
      - name: Install Cosign
        if: ${{ github.event_name == 'push' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign exact GCP archive
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.input.outputs.version }}
        run: cosign sign-blob --yes --bundle "dist/swarm-${VERSION}-linux-amd64.tar.gz.sigstore.json" "dist/swarm-${VERSION}-linux-amd64.tar.gz"
      - name: Attest GCP qualification promotion, not GitHub build
        if: ${{ github.event_name == 'push' }}
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/swarm-${{ steps.input.outputs.version }}-linux-amd64.tar.gz.sha256
          predicate-type: https://swarm.dev/attestations/release-promotion/v1
          predicate-path: dist/promotion-predicate.json
      - name: Independently verify signed promotion
        if: ${{ github.event_name == 'push' }}
        env:
          TMPDIR: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.input.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          archive="dist/swarm-${VERSION}-linux-amd64.tar.gz"
          cp -- "${PROVENANCE_BUNDLE}" "${archive}.provenance.sigstore.json"
          ./scripts/verify-release-evidence.sh "${archive}" "${archive}.sha256" "${archive}.sigstore.json" "${archive}.provenance.sigstore.json" \
            --repository "${GITHUB_REPOSITORY}" --source-sha "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" \
            --workflow-ref "${WORKFLOW_REF}" --workflow-sha "${WORKFLOW_SHA}" --workflow-identity "https://github.com/${WORKFLOW_REF}" \
            --workflow-name "${GITHUB_WORKFLOW}" --event-name "${GITHUB_EVENT_NAME}" --gcp-promotion-dir dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: stable-release-${{ steps.input.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-stable-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build-stable-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-${{ needs.build-stable-release.outputs.version }}
          path: release-evidence
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Reverify and publish protected exact bytes
        env:
          TMPDIR: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-stable-release.outputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="release-evidence/swarm-${VERSION}-linux-amd64.tar.gz"
          ./scripts/verify-release-evidence.sh "${archive}" "${archive}.sha256" "${archive}.sigstore.json" "${archive}.provenance.sigstore.json" \
            --repository "${GITHUB_REPOSITORY}" --source-sha "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" \
            --workflow-ref "${WORKFLOW_REF}" --workflow-sha "${WORKFLOW_SHA}" --workflow-identity "https://github.com/${WORKFLOW_REF}" \
            --workflow-name "${GITHUB_WORKFLOW}" --event-name "${GITHUB_EVENT_NAME}" --gcp-promotion-dir release-evidence
          # API failures must not be interpreted as an absent tag/release.
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}" > "${RUNNER_TEMP}/release-tags.json"
          jq -e --arg ref "refs/tags/${VERSION}" 'all(.[]; .ref != $ref)' "${RUNNER_TEMP}/release-tags.json"
          gh release create "${VERSION}" "${archive}" "${archive}.sha256" "${archive}.sigstore.json" "${archive}.provenance.sigstore.json" \
            release-evidence/build-info.txt release-evidence/gcp-qualification-evidence.json release-evidence/gcp-release-manifest.json \
            release-evidence/gcp-build-provenance.json release-evidence/promotion-predicate.json \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "Swarm ${VERSION}" \
            --notes "GCP-built and qualified exact merged source; GitHub verified, keyless-signed and promoted these unchanged bytes after protected environment approval."
