name: build-main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: ./scripts/check-secrets.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack pnpm --version

      - name: Resolve candidate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          case "${EVENT_NAME}" in
            pull_request)
              version="pr-${PR_NUMBER}-${short_sha}"
              ;;
            push)
              version="main-${short_sha}"
              ;;
            workflow_dispatch)
              version="dispatch-${short_sha}"
              ;;
            *)
              echo "unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release candidate
        run: ./scripts/build-main-dist.sh --output-dir dist --version "${{ steps.version.outputs.version }}"

      - name: Smoke release archive and artifact-root install
        env:
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/smoke-release-archive.sh "dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" "dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256" --evidence "dist/smoke-evidence.txt"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign final Linux archive with keyless Sigstore
        shell: bash
        env:
          ARCHIVE: dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
        run: cosign sign-blob --yes --bundle "${ARCHIVE}.sigstore.json" "${ARCHIVE}"

      - name: Attest final Linux archive provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256

      - name: Preserve and independently verify release evidence
        shell: bash
        env:
          ARCHIVE: dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          EXPECTED_WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          cp -- "${PROVENANCE_BUNDLE}" "${ARCHIVE}.provenance.sigstore.json"
          ./scripts/verify-release-evidence.sh \
            "${ARCHIVE}" \
            "${ARCHIVE}.sha256" \
            "${ARCHIVE}.sigstore.json" \
            "${ARCHIVE}.provenance.sigstore.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --workflow-ref "${EXPECTED_WORKFLOW_REF}" \
            --workflow-sha "${EXPECTED_WORKFLOW_SHA}" \
            --workflow-identity "${EXPECTED_WORKFLOW_IDENTITY}" \
            --workflow-name "${GITHUB_WORKFLOW}" \
            --event-name "${GITHUB_EVENT_NAME}"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-candidate-${{ steps.version.outputs.version }}
          path: |
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sigstore.json
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.provenance.sigstore.json
            dist/build-info.txt
            dist/smoke-evidence.txt
          if-no-files-found: error
          retention-days: 14
