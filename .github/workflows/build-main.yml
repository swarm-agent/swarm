name: build-main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a stable release after candidate verification
        required: true
        type: boolean
        default: false
      release_version:
        description: Stable semver tag (vX.Y.Z); required when publish is enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: ./scripts/check-secrets.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack pnpm --version

      - name: Resolve candidate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          case "${EVENT_NAME}" in
            pull_request)
              version="pr-${PR_NUMBER}-${short_sha}"
              ;;
            push)
              version="main-${short_sha}"
              ;;
            workflow_dispatch)
              if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
                version="${REQUESTED_RELEASE_VERSION}"
                if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "stable publication requires release_version=vX.Y.Z" >&2
                  exit 1
                fi
              else
                version="dispatch-${short_sha}"
              fi
              ;;
            *)
              echo "unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release candidate
        run: ./scripts/build-main-dist.sh --output-dir dist --version "${{ steps.version.outputs.version }}"

      - name: Verify release candidate
        run: ./scripts/verify-release-candidate.sh "dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz" "dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-candidate-${{ steps.version.outputs.version }}
          path: |
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/swarm-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
            dist/build-info.txt
          if-no-files-found: error
          retention-days: 14

  publish-stable:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' }}
    needs:
      - build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: stable-release
    permissions:
      contents: write

    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download verified candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-candidate-${{ needs.build-candidate.outputs.version }}
          path: dist

      - name: Reverify candidate and release target
        shell: bash
        env:
          VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish non-stable version: ${VERSION}" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "release tag already exists: ${VERSION}" >&2
            exit 1
          fi
          ./scripts/verify-release-candidate.sh "dist/swarm-${VERSION}-linux-amd64.tar.gz" "dist/swarm-${VERSION}-linux-amd64.tar.gz.sha256"

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-candidate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build-candidate.outputs.version }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/swarm-${{ needs.build-candidate.outputs.version }}-linux-amd64.tar.gz
            dist/swarm-${{ needs.build-candidate.outputs.version }}-linux-amd64.tar.gz.sha256
            dist/build-info.txt
