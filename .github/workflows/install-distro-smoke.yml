name: install-distro-smoke

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-distro-smoke-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Set up pnpm
        run: corepack enable
      - name: Build candidate archive
        run: ./scripts/build-main-dist.sh --output-dir dist --version "candidate-${GITHUB_SHA::12}"
      - name: Upload exact candidate archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: install-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/swarm-candidate-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 2

  distro-install:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu
          - arch
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exact candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - name: Install from zero on ${{ matrix.distro }}
        env:
          TMPDIR: ${{ runner.temp }}
          SWARM_INSTALL_DISTRO_RUNTIME: docker
        run: |
          shopt -s nullglob
          archives=(candidate/swarm-candidate-*-linux-amd64.tar.gz)
          [[ ${#archives[@]} -eq 1 ]]
          ./scripts/test-install-distro.sh --archive "${archives[0]}" --distro "${{ matrix.distro }}"
