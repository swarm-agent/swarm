name: install-distro-smoke

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: read

concurrency:
  group: install-distro-smoke-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted immutable verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/gcp-result-relay.py
          sparse-checkout-cone-mode: false
      - name: Verify exact GCP result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_CHECK_APP_ID: ${{ vars.GCP_CHECK_APP_ID }}
          GCP_CHECK_CONTEXT: install-distro-smoke
        run: python3 -I scripts/gcp-result-relay.py

  # Independent relays preserve every matrix check even when build-candidate fails.
  # Each verifies ALL required build/install stages, not a candidate success flag.
  distro-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu
          - arch
    steps:
      - name: Check out trusted immutable verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/gcp-result-relay.py
          sparse-checkout-cone-mode: false
      - name: Verify exact GCP result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GCP_CHECK_APP_ID: ${{ vars.GCP_CHECK_APP_ID }}
          GCP_CHECK_CONTEXT: install-distro-smoke
        run: python3 -I scripts/gcp-result-relay.py
